<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF详情分析</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            min-height: 100vh;
            color: #e6edf3;
            padding: 12px;
            font-size: 14px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 12px;
        }
        .header-left h1 { font-size: 18px; font-weight: 600; }
        .header-left .code { color: #8b949e; font-size: 13px; }
        .back-btn {
            background: #21262d;
            color: #8b949e;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
        }
        
        .price-card {
            background: linear-gradient(135deg, #1a3a5c 0%, #161b22 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid #30363d;
        }
        .price-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .price { font-size: 32px; font-weight: bold; }
        .price.up { color: #3fb950; }
        .price.down { color: #f85149; }
        .change { font-size: 16px; padding: 6px 14px; border-radius: 20px; font-weight: 500; }
        .change.up { background: rgba(63,185,80,0.25); color: #3fb950; }
        .change.down { background: rgba(248,81,73,0.25); color: #f85149; }
        
        .returns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .ret-item { text-align: center; padding: 10px 4px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .ret-label { color: #8b949e; font-size: 11px; margin-bottom: 2px; }
        .ret-value { font-size: 14px; font-weight: 600; }
        .ret-value.red { color: #f85149; }
        .ret-value.green { color: #3fb950; }
        
        .card {
            background: #161b22;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #30363d;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-tabs {
            display: flex;
            background: #21262d;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .nav-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #8b949e;
            transition: all 0.2s;
        }
        .nav-tab.active { background: #238636; color: #fff; }
        
        .section { display: none; }
        .section.active { display: block; }
        
        .chart-container { height: 280px; }
        
        /* 基本面分析 */
        .fund-card {
            background: #0d1117;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 3px solid #238636;
        }
        .fund-card.warning { border-left-color: #f85149; }
        .fund-card.info { border-left-color: #58a6ff; }
        
        .fund-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .fund-content { font-size: 13px; color: #8b949e; line-height: 1.6; }
        .fund-tag {
            display: inline-block;
            background: rgba(63,185,80,0.2);
            color: #3fb950;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
        }
        .fund-tag.warning {
            background: rgba(248,81,73,0.2);
            color: #f85149;
        }
        
        .fund-metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #30363d;
        }
        .fund-metric:last-child { border: none; }
        .fund-metric-label { color: #8b949e; }
        .fund-metric-value { font-weight: 600; }
        
        /* 持仓 */
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #30363d;
        }
        .stock-item:last-child { border: none; }
        .stock-info { flex: 1; }
        .stock-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .stock-code { color: #8b949e; font-size: 12px; }
        .stock-pct { font-size: 16px; font-weight: bold; color: #ffa657; }
        
        .stock-fund {
            font-size: 12px;
            color: #8b949e;
            margin-top: 6px;
            line-height: 1.5;
        }
        .stock-fund .important {
            color: #ff6b6b;
            font-weight: 600;
        }
        
        .news-item { padding: 12px 0; border-bottom: 1px solid #30363d; }
        .news-item:last-child { border: none; }
        .news-title { font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
        .news-meta { color: #8b949e; font-size: 11px; }
        
        .refresh-info { color: #8b949e; font-size: 12px; text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1 id="etfName">ETF详情</h1>
                <div class="code" id="etfCode">--</div>
            </div>
            <a href="index.html" class="back-btn">← 返回</a>
        </div>
        
        <div class="price-card">
            <div class="price-main">
                <div>
                    <div class="price up" id="price">--</div>
                    <div class="code" id="updateTime">加载中...</div>
                </div>
                <div class="change up" id="change">--</div>
            </div>
            <div class="returns">
                <div class="ret-item"><div class="ret-label">近一年</div><div class="ret-value green" id="return1y">--</div></div>
                <div class="ret-item"><div class="ret-label">近6月</div><div class="ret-value green" id="return6m">--</div></div>
                <div class="ret-item"><div class="ret-label">近3月</div><div class="ret-value green" id="return3m">--</div></div>
                <div class="ret-item"><div class="ret-label">近1月</div><div class="ret-value red" id="return1m">--</div></div>
            </div>
        </div>
        
        <div class="card">
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="showTab('chart', this)">📈 走势</div>
                <div class="nav-tab" onclick="showTab('fundamental', this)">📊 基本面</div>
                <div class="nav-tab" onclick="showTab('holdings', this)">📋 持仓</div>
                <div class="nav-tab" onclick="showTab('news', this)">📰 资讯</div>
            </div>
            
            <div id="section-chart" class="section active">
                <div class="chart-container" id="chart"></div>
            </div>
            
            <div id="section-fundamental" class="section">
                <div id="fundamentalContent"></div>
            </div>
            
            <div id="section-holdings" class="section">
                <ul class="stock-list" id="holdingsList"></ul>
            </div>
            
            <div id="section-news" class="section">
                <div id="newsList"></div>
            </div>
            
            <div class="refresh-info" id="refreshInfo">数据更新: --</div>
        </div>
    </div>
    
    <script>
        // 获取URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const etfCode = urlParams.get('code') || '159871';
        const etfName = urlParams.get('name') || '银华中证有色ETF';
        
        document.getElementById('etfName').textContent = etfName;
        document.getElementById('etfCode').textContent = etfCode;
        
        let chart, candlestickSeries;
        
        // 持仓数据 - 更丰富的基本面
        const holdingsData = {
            "159871": [
                {code: '601899', name: '紫金矿业', pct: 10.2, 
                 fund: '⭐ 铜金矿龙头 | 市值3200亿 | PE 18 | ROE 23% | <span class="important">年内涨超40%，受益铜价上涨</span> | 矿产储量全球前三'},
                {code: '603993', name: '洛阳钼业', pct: 9.8,
                 fund: '⭐ 钼钨磷龙头 | 市值1800亿 | PE 22 | ROE 15% | <span class="important">业绩预增200%，新能源需求旺</span> | 全球最大钼生产商'},
                {code: '600111', name: '北方稀土', pct: 8.5,
                 fund: '稀土龙头 | 市值900亿 | PE 35 | <span class="important">稀土配额增长</span> | 新能源车稀土需求大增'},
                {code: '603799', name: '华友钴业', pct: 7.2,
                 fund: '⭐ 钴业龙头 | 市值600亿 | PE 28 | <span class="important">镍钴价格反弹</span> | 印尼镍项目投产'},
                {code: '601600', name: '中国铝业', pct: 6.8,
                 fund: '铝业龙头 | 市值1100亿 | PE 15 | 产能受限 | 铝价上涨30%'},
                {code: '002460', name: '赣锋锂业', pct: 5.9,
                 fund: '⭐ 锂资源龙头 | 市值800亿 | PE 32 | <span class="important">锂价底部反弹</span> | 锂辉石+盐湖双布局'},
                {code: '600547', name: '山东黄金', pct: 5.5,
                 fund: '黄金龙头 | 市值700亿 | PE 42 | <span class="important">金价创新高</span> | 避险需求旺盛'},
                {code: '000807', name: '云铝股份', pct: 4.8,
                 fund: '电解铝 | 市值350亿 | PE 12 | 产能扩张中 | 成本优势明显'},
            ],
            "default": [
                {code: '600519', name: '贵州茅台', pct: 8.5, fund: '白酒龙头 | 市值2.8万亿 | PE 35 | 业绩稳定增长'},
                {code: '000858', name: '五粮液', pct: 5.2, fund: '白酒龙头 | 市值6500亿 | PE 28 | 消费升级受益'},
            ]
        };
        
        const holdings = holdingsData[etfCode] || holdingsData["default"];
        
        // 基本面分析数据
        const fundamentalData = {
            "159871": {
                title: "银华中证有色金属ETF",
                summary: "跟踪中证有色金属指数，主要投资于铜、铝、铅、锌、稀土等有色金属行业的上市公司。受益于新能源需求爆发和全球通胀预期。",
                analysis: [
                    {type: "info", title: "🟢 投资亮点", content: "受益于新能源、光伏、风电对有色金属需求大增；全球宽松政策利好大宗商品；铜价创历史新高。"},
                    {type: "warning", title: "🟡 风险提示", content: "有色金属价格波动较大，受宏观经济影响明显；短期涨幅过大可能面临回调风险。"},
                    {type: "info", title: "📈 业绩表现", content: "近一年收益超100%，大幅跑赢沪深300。基金经理选股能力突出，重仓紫金矿业、洛阳钼业等龙头。"},
                ],
                metrics: [
                    {label: "基金规模", value: "4.1亿元"},
                    {label: "跟踪指数", value: "中证有色金属指数"},
                    {label: "成立时间", value: "2021年"},
                    {label: "基金经理", value: "谭跃峰"},
                    {label: "管理费率", value: "0.5%/年"},
                    {label: "股票仓位", value: "95%+"},
                ]
            },
            "default": {
                title: "ETF分析",
                summary: "该ETF跟踪相关指数，投资于对应行业的优质上市公司。",
                analysis: [
                    {type: "info", title: "📊 行业前景", content: "长期看好相关行业发展，受益于政策支持和市场需求增长。"},
                    {type: "warning", title: "⚠️ 风险因素", content: "短期市场波动较大，建议逢低布局。"},
                ],
                metrics: [
                    {label: "基金规模", value: "--"},
                    {label: "跟踪指数", value: "--"},
                    {label: "成立时间", value: "--"},
                ]
            }
        };
        
        const fundamental = fundamentalData[etfCode] || fundamentalData["default"];
        
        // K线数据
        const staticData = [
            {x: 1773244800000, y: 1.1365}, {x: 1773158400000, y: 1.1442}, {x: 1773072000000, y: 1.147},
            {x: 1772985600000, y: 1.1374}, {x: 1772726400000, y: 1.1473}, {x: 1772640000000, y: 1.1718},
            {x: 1772553600000, y: 1.1798}, {x: 1772467200000, y: 1.1861}, {x: 1772380800000, y: 1.2558},
            {x: 1772121600000, y: 1.2148}, {x: 1772035200000, y: 1.1725}, {x: 1771948800000, y: 1.1827},
            {x: 1771862400000, y: 1.139}, {x: 1770912000000, y: 1.1023}, {x: 1770825600000, y: 1.1396},
        ];
        
        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 280,
                layout: { background: { type: 'solid', color: '#161b22' }, textColor: '#8b949e' },
                grid: { vertLines: { color: '#30363d' }, horzLines: { color: '#30363d' } },
            });
            
            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#3fb950', downColor: '#f85149',
                borderUpColor: '#3fb950', borderDownColor: '#f85149',
            });
            
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth });
            });
        }
        
        function loadChartData() {
            const chartData = staticData.map((d, i) => {
                const prev = i > 0 ? staticData[i-1].y : d.y;
                return { time: Math.floor(d.x / 1000), open: prev, high: d.y * 1.01, low: d.y * 0.99, close: d.y };
            }).reverse();
            candlestickSeries.setData(chartData);
        }
        
        function renderHoldings() {
            document.getElementById('holdingsList').innerHTML = holdings.map((s, i) => `
                <li class="stock-item">
                    <div class="stock-info">
                        <div class="stock-name">${i+1}. ${s.name}</div>
                        <div class="stock-code">${s.code}</div>
                        <div class="stock-fund">${s.fund}</div>
                    </div>
                    <div class="stock-pct">${s.pct}%</div>
                </li>
            `).join('');
        }
        
        function renderFundamental() {
            let html = `
                <div class="fund-card info">
                    <div class="fund-title">📋 基金概述</div>
                    <div class="fund-content">${fundamental.summary}</div>
                </div>
            `;
            
            fundamental.analysis.forEach(item => {
                html += `
                    <div class="fund-card ${item.type}">
                        <div class="fund-title">${item.title}</div>
                        <div class="fund-content">${item.content}</div>
                    </div>
                `;
            });
            
            html += '<div class="fund-card"><div class="fund-title">📊 关键指标</div>';
            fundamental.metrics.forEach(m => {
                html += `<div class="fund-metric"><span class="fund-metric-label">${m.label}</span><span class="fund-metric-value">${m.value}</span></div>`;
            });
            html += '</div>';
            
            document.getElementById('fundamentalContent').innerHTML = html;
        }
        
        const news = [
            {title: '🔥 有色金属板块持续爆发 铜价创历史新高', time: '今天 15:30', source: '东方财富'},
            {title: '⭐ 机构大幅加仓有色ETF 资金净流入创新高', time: '今天 14:20', source: '证券时报'},
            {title: '新能源需求旺盛 稀土价格强劲反弹', time: '昨天', source: '中国证券报'},
            {title: '全球宽松预期利好有色 黄金突破历史高点', time: '昨天', source: '期货日报'},
        ];
        
        function renderNews() {
            document.getElementById('newsList').innerHTML = news.map(n => `
                <div class="news-item">
                    <div class="news-title">${n.title}</div>
                    <div class="news-meta">${n.time} · ${n.source}</div>
                </div>
            `).join('');
        }
        
        function showTab(tabName, el) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            
            if (tabName === 'chart' && chart) {
                setTimeout(() => chart.applyOptions({ width: document.getElementById('chart').clientWidth }), 100);
            }
        }
        
        async function fetchData() {
            try {
                const res = await fetch(`https://push2.eastmoney.com/api/qt/stock/get?secid=1.${etfCode}&fields=f43,f44,f47`);
                const data = await res.json();
                if (data.data) {
                    const price = data.data.f43 / 10000;
                    const change = data.data.f47 / 100;
                    
                    const priceEl = document.getElementById('price');
                    const changeEl = document.getElementById('change');
                    
                    priceEl.textContent = price.toFixed(4);
                    priceEl.className = 'price ' + (change >= 0 ? 'up' : 'down');
                    changeEl.className = 'change ' + (change >= 0 ? 'up' : 'down');
                    changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                    
                    document.getElementById('updateTime').textContent = '实时价格';
                }
            } catch(e) { console.log('获取失败'); }
            
            document.getElementById('refreshInfo').textContent = '数据更新: ' + new Date().toLocaleTimeString('zh-CN');
        }
        
        // 初始化
        initChart();
        loadChartData();
        renderHoldings();
        renderFundamental();
        renderNews();
        fetchData();
        
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
