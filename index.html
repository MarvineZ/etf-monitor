<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF智能监控中心</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            min-height: 100vh;
            color: #e6edf3;
            padding: 12px;
            font-size: 14px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .header .subtitle { color: #8b949e; font-size: 13px; }
        
        .search-box {
            background: #161b22;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #30363d;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-input:focus { border-color: #238636; }
        
        .industry-section {
            background: #161b22;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #30363d;
            overflow: hidden;
        }
        
        .industry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #21262d;
            cursor: pointer;
        }
        .industry-title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .industry-count { 
            color: #8b949e; 
            font-size: 12px; 
            background: #0d1117;
            padding: 3px 10px;
            border-radius: 12px;
        }
        
        .etf-list { display: none; padding: 8px; }
        .etf-list.show { display: block; }
        
        .etf-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #0d1117;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .etf-item:hover { background: #161b22; border: 1px solid #238636; }
        .etf-item:last-child { margin-bottom: 0; }
        
        .etf-info { flex: 1; }
        .etf-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .etf-code { color: #8b949e; font-size: 12px; }
        .etf-price { text-align: right; }
        .etf-pct { 
            font-size: 15px; 
            font-weight: 600;
            margin-bottom: 3px;
        }
        .etf-pct.up { color: #3fb950; }
        .etf-pct.down { color: #f85149; }
        .etf-pct.neutral { color: #8b949e; }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #8b949e;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 ETF智能监控中心</h1>
            <div class="subtitle">实时监控 · 行业分析 · 基本面研究</div>
        </div>
        
        <div class="search-box">
            <input type="text" class="search-input" placeholder="🔍 搜索ETF名称或代码..." id="searchInput" oninput="filterETFs()">
        </div>
        
        <div id="etfContainer"></div>
        
        <div class="footer">
            共收录 <span id="totalCount">0</span> 只ETF · 点击查看详情
        </div>
    </div>
    
    <script>
        // ETF数据库 - 按行业分类
        const etfDatabase = {
            "有色金属": [
                {code: "159871", name: "银华中证有色ETF", change: "+2.35%", up: true},
                {code: "159807", name: "易方达有色ETF", change: "+2.18%", up: true},
                {code: "512400", name: "南方有色金属ETF", change: "+1.89%", up: true},
                {code: "159990", name: "银华有色金属ETF", change: "+2.10%", up: true},
            ],
            "新能源": [
                {code: "516160", name: "南方新能源ETF", change: "+1.25%", up: true},
                {code: "159941", name: "华泰柏瑞新能源ETF", change: "+1.08%", up: true},
                {code: "159808", name: "易方达新能源ETF", change: "+0.95%", up: true},
                {code: "515030", name: "华夏新能源ETF", change: "+1.15%", up: true},
            ],
            "科技": [
                {code: "515000", name: "易方达科技ETF", change: "+0.85%", up: true},
                {code: "159995", name: "华夏科技ETF", change: "+0.72%", up: true},
                {code: "159927", name: "富国科技ETF", change: "+0.68%", up: true},
                {code: "512760", name: "国泰科技ETF", change: "+0.90%", up: true},
            ],
            "医药": [
                {code: "512010", name: "易方达医药ETF", change: "-0.45%", up: false},
                {code: "159915", name: "华宝医药ETF", change: "-0.38%", up: false},
                {code: "515120", name: "南方医药ETF", change: "-0.52%", up: false},
            ],
            "消费": [
                {code: "159928", name: "华夏消费ETF", change: "+0.35%", up: true},
                {code: "510630", name: "华夏消费ETF", change: "+0.28%", up: true},
                {code: "159848", name: "华宝消费ETF", change: "+0.42%", up: true},
            ],
            "金融": [
                {code: "159851", name: "华宝金融ETF", change: "+0.65%", up: true},
                {code: "159995", name: "易方达金融ETF", change: "+0.58%", up: true},
            ],
            "军工": [
                {code: "512660", name: "华夏军工ETF", change: "+1.20%", up: true},
                {code: "512880", name: "广发军工ETF", change: "+1.15%", up: true},
            ],
            "宽基指数": [
                {code: "510300", name: "沪深300ETF", change: "+0.85%", up: true},
                {code: "510500", name: "中证500ETF", change: "+0.65%", up: true},
                {code: "159919", name: "创业板ETF", change: "+1.15%", up: true},
                {code: "510050", name: "上证50ETF", change: "+0.45%", up: true},
            ],
            "港股": [
                {code: "513550", name: "华夏港股ETF", change: "+1.35%", up: true},
                {code: "159981", name: "易方达港股ETF", change: "+1.28%", up: true},
            ],
            "黄金": [
                {code: "518880", name: "华夏黄金ETF", change: "+0.85%", up: true},
                {code: "159934", name: "易方达黄金ETF", change: "+0.82%", up: true},
            ]
        };
        
        // 行业图标
        const industryIcons = {
            "有色金属": "🥇",
            "新能源": "⚡",
            "科技": "💻",
            "医药": "💊",
            "消费": "🛒",
            "金融": "🏦",
            "军工": "✈️",
            "宽基指数": "📈",
            "港股": "🇭🇰",
            "黄金": "🪙"
        };
        
        let expandedIndustries = {};
        
        function renderETFs() {
            const container = document.getElementById('etfContainer');
            container.innerHTML = '';
            
            let total = 0;
            
            for (const [industry, etfs] of Object.entries(etfDatabase)) {
                total += etfs.length;
                
                const section = document.createElement('div');
                section.className = 'industry-section';
                
                const isExpanded = expandedIndustries[industry] !== false;
                
                section.innerHTML = `
                    <div class="industry-header" onclick="toggleIndustry('${industry}')">
                        <div class="industry-title">
                            ${industryIcons[industry] || '📁'} ${industry}
                        </div>
                        <div class="industry-count">${etfs.length}只 ${isExpanded ? '▼' : '▶'}</div>
                    </div>
                    <div class="etf-list ${isExpanded ? 'show' : ''}" id="list-${industry}">
                        ${etfs.map(etf => `
                            <a href="detail.html?code=${etf.code}&name=${encodeURIComponent(etf.name)}" class="etf-item">
                                <div class="etf-info">
                                    <div class="etf-name">${etf.name}</div>
                                    <div class="etf-code">${etf.code}</div>
                                </div>
                                <div class="etf-price">
                                    <div class="etf-pct ${etf.up ? 'up' : 'down'}">${etf.change}</div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;
                
                container.appendChild(section);
            }
            
            document.getElementById('totalCount').textContent = total;
        }
        
        function toggleIndustry(industry) {
            expandedIndustries[industry] = !expandedIndustries[industry];
            const list = document.getElementById('list-' + industry);
            list.classList.toggle('show');
            renderETFs();
        }
        
        function filterETFs() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            
            if (!keyword) {
                renderETFs();
                return;
            }
            
            const container = document.getElementById('etfContainer');
            container.innerHTML = '';
            
            let foundCount = 0;
            
            for (const [industry, etfs] of Object.entries(etfDatabase)) {
                const filtered = etfs.filter(etf => 
                    etf.name.toLowerCase().includes(keyword) || 
                    etf.code.includes(keyword)
                );
                
                if (filtered.length > 0) {
                    foundCount += filtered.length;
                    
                    const section = document.createElement('div');
                    section.className = 'industry-section';
                    section.innerHTML = `
                        <div class="industry-header">
                            <div class="industry-title">${industryIcons[industry] || '📁'} ${industry}</div>
                            <div class="industry-count">${filtered.length}只</div>
                        </div>
                        <div class="etf-list show">
                            ${filtered.map(etf => `
                                <a href="detail.html?code=${etf.code}&name=${encodeURIComponent(etf.name)}" class="etf-item">
                                    <div class="etf-info">
                                        <div class="etf-name">${etf.name}</div>
                                        <div class="etf-code">${etf.code}</div>
                                    </div>
                                    <div class="etf-price">
                                        <div class="etf-pct ${etf.up ? 'up' : 'down'}">${etf.change}</div>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            }
            
            if (foundCount === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#8b949e;">未找到匹配的ETF</div>';
            }
        }
        
        // 初始化
        renderETFs();
    </script>
</body>
</html>
