<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有色ETF银华(159871)实时监控</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            min-height: 100vh;
            color: #e6edf3;
            padding: 16px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; }
        .header .code { color: #8b949e; font-size: 14px; }
        
        .card {
            background: #161b22;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #30363d;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .price { font-size: 36px; font-weight: bold; }
        .price.up { color: #3fb950; }
        .price.down { color: #f85149; }
        .change { font-size: 18px; padding: 6px 12px; border-radius: 6px; }
        .change.up { background: rgba(63,185,80,0.2); color: #3fb950; }
        .change.down { background: rgba(248,81,73,0.2); color: #f85149; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .stat-item {
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label { color: #8b949e; font-size: 12px; margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: 600; }
        .stat-value.red { color: #f85149; }
        .stat-value.green { color: #3fb950; }
        
        .chart-container { height: 400px; position: relative; }
        
        .indicators {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .indicator-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #8b949e;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .indicator-btn.active {
            background: #238636;
            color: #fff;
            border-color: #238636;
        }
        
        .news-section h3 { margin-bottom: 16px; font-size: 16px; }
        .news-item {
            padding: 12px 0;
            border-bottom: 1px solid #30363d;
        }
        .news-item:last-child { border: none; }
        .news-title { font-size: 14px; line-height: 1.5; margin-bottom: 6px; }
        .news-meta { color: #8b949e; font-size: 12px; }
        
        .loading { color: #8b949e; text-align: center; padding: 40px; }
        .error { color: #f85149; text-align: center; padding: 20px; }
        
        .refresh-info { color: #8b949e; font-size: 12px; text-align: right; margin-top: 8px; }
        
        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .chart-container { height: 300px; }
            .price { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>有色ETF银华</h1>
                <div class="code">159871 | 深交所</div>
            </div>
            <div style="text-align: right;">
                <div class="price" id="price">--</div>
                <div class="change" id="change">加载中</div>
            </div>
        </div>
        
        <div class="card">
            <div class="indicators">
                <button class="indicator-btn active" data-ind="KLINE" onclick="switchChart('KLINE')">K线</button>
                <button class="indicator-btn" data-ind="MA" onclick="switchChart('MA')">MA均线</button>
                <button class="indicator-btn" data-ind="VOL" onclick="switchChart('VOL')">成交量</button>
                <button class="indicator-btn" onclick="refreshData()">🔄 刷新</button>
            </div>
            <div class="chart-container" id="chart"></div>
            <div class="refresh-info" id="refreshInfo">最近更新: --</div>
        </div>
        
        <div class="card">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">近一年</div>
                    <div class="stat-value green" id="return1y">+103.36%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">近6月</div>
                    <div class="stat-value green" id="return6m">+45.15%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">近3月</div>
                    <div class="stat-value green" id="return3m">+27.09%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">近1月</div>
                    <div class="stat-value red" id="return1m">-0.27%</div>
                </div>
            </div>
        </div>
        
        <div class="card news-section">
            <h3>📰 最新资讯</h3>
            <div id="newsList">
                <div class="loading">正在加载...</div>
            </div>
        </div>
    </div>
    
    <script>
        const ETF_CODE = '159871';
        let chart, candlestickSeries, volumeSeries;
        let chartData = [];
        let currentIndicator = 'KLINE';
        
        // 初始化图表
        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 400,
                layout: {
                    background: { type: 'solid', color: '#161b22' },
                    textColor: '#8b949e',
                },
                grid: {
                    vertLines: { color: '#30363d' },
                    horzLines: { color: '#30363d' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                },
            });
            
            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#3fb950',
                downColor: '#f85149',
                borderUpColor: '#3fb950',
                borderDownColor: '#f85149',
                wickUpColor: '#3fb950',
                wickDownColor: '#f85149',
            });
            
            // 成交量
            volumeSeries = chart.addHistogramSeries({
                color: '#58a6ff',
                priceFormat: { type: 'volume' },
                priceScaleId: '',
            });
            volumeSeries.priceScale().applyOptions({
                scaleMargins: { top: 0.8, bottom: 0 },
            });
            
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth });
            });
        }
        
        // 切换指标
        function switchChart(ind) {
            currentIndicator = ind;
            document.querySelectorAll('.indicator-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.ind === ind);
            });
            
            if (ind === 'KLINE') {
                candlestickSeries.applyOptions({ visible: true });
            } else if (ind === 'MA') {
                // 添加均线
                const maData = calculateMA(chartData, 5);
                candlestickSeries.setData(chartData);
            }
        }
        
        // 计算均线
        function calculateMA(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push({ time: data[i].time, value: null });
                    continue;
                }
                let sum = 0;
                for (let j = 0; j < period; j++) {
                    sum += data[i - j].close;
                }
                result.push({ time: data[i].time, value: sum / period });
            }
            return result;
        }
        
        // 获取数据
        async function fetchData() {
            try {
                const response = await fetch(`https://fund.eastmoney.com/pingzhongdata/${ETF_CODE}.js?v=${Date.now()}`);
                const text = await response.text();
                
                // 解析净值数据
                const netWorthMatch = text.match(/var Data_netWorthTrend = (\[.*?\]);/s);
                if (!netWorthMatch) throw new Error('无法解析数据');
                
                const trendData = JSON.parse(netWorthMatch[1]);
                chartData = trendData.map(d => ({
                    time: Math.floor(d.x / 1000),
                    open: d.y,
                    high: d.y * 1.02,
                    low: d.y * 0.98,
                    close: d.y,
                })).reverse();
                
                // 更新图表
                candlestickSeries.setData(chartData);
                
                // 成交量（模拟）
                const volumes = chartData.map((d, i) => ({
                    time: d.time,
                    value: 1000000 + Math.random() * 500000,
                    color: i > 0 && d.close >= chartData[i-1].close ? 'rgba(63,185,80,0.5)' : 'rgba(248,81,73,0.5)',
                }));
                volumeSeries.setData(volumes);
                
                // 更新价格
                const latest = chartData[chartData.length - 1];
                const prev = chartData[chartData.length - 2] || latest;
                const change = ((latest.close - prev.close) / prev.close * 100).toFixed(2);
                
                const priceEl = document.getElementById('price');
                const changeEl = document.getElementById('change');
                
                priceEl.textContent = latest.close.toFixed(4);
                if (parseFloat(change) >= 0) {
                    priceEl.className = 'price up';
                    changeEl.className = 'change up';
                    changeEl.textContent = '+' + change + '%';
                } else {
                    priceEl.className = 'price down';
                    changeEl.className = 'change down';
                    changeEl.textContent = change + '%';
                }
                
                document.getElementById('refreshInfo').textContent = 
                    '最近更新: ' + new Date().toLocaleString('zh-CN');
                
                // 更新收益数据
                updateReturns(text);
                
            } catch (error) {
                console.error('获取数据失败:', error);
            }
        }
        
        // 更新收益率
        function updateReturns(text) {
            const patterns = {
                'return1y': /var syl_1n="([^"]+)"/,
                'return6m': /var syl_6y="([^"]+)"/,
                'return3m': /var syl_3y="([^"]+)"/,
                'return1m': /var syl_1y="([^"]+)"/,
            };
            
            for (const [id, pattern] of Object.entries(patterns)) {
                const match = text.match(pattern);
                if (match) {
                    const val = parseFloat(match[1]);
                    const el = document.getElementById(id);
                    el.textContent = (val >= 0 ? '+' : '') + val.toFixed(2) + '%';
                    el.className = 'stat-value ' + (val >= 0 ? 'green' : 'red');
                }
            }
        }
        
        // 获取资讯
        async function fetchNews() {
            const newsEl = document.getElementById('newsList');
            try {
                const response = await fetch(`https://searchapi.eastmoney.com/api/news/get?keyword=%E9%93%B6%E5%8D%8E%E6%9C%89%E8%89%B2ETF&pageindex=0&pagesize=10`);
                const data = await response.json();
                
                if (data.Data && data.Data.length > 0) {
                    newsEl.innerHTML = data.Data.slice(0, 8).map(news => `
                        <div class="news-item">
                            <div class="news-title">${news.Title}</div>
                            <div class="news-meta">${news.ShowDate} · ${news.Source}</div>
                        </div>
                    `).join('');
                } else {
                    newsEl.innerHTML = '<div class="loading">暂无资讯</div>';
                }
            } catch (error) {
                // 尝试备用接口
                try {
                    const response = await fetch(`https://searchapi.eastmoney.com/api/news/get?keyword=159871&pageindex=0&pagesize=5`);
                    const data = await response.json();
                    if (data.Data && data.Data.length > 0) {
                        newsEl.innerHTML = data.Data.map(news => `
                            <div class="news-item">
                                <div class="news-title">${news.Title}</div>
                                <div class="news-meta">${news.ShowDate}</div>
                            </div>
                        `).join('');
                    }
                } catch (e) {
                    newsEl.innerHTML = '<div class="error">资讯加载失败</div>';
                }
            }
        }
        
        function refreshData() {
            fetchData();
            fetchNews();
        }
        
        // 初始化
        initChart();
        fetchData();
        fetchNews();
        
        // 自动刷新
        setInterval(() => {
            fetchData();
        }, 60000);
    </script>
</body>
</html>
