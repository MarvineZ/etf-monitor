<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有色ETF银华(159871)实时监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px 0;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header .code {
            color: #aaa;
            font-size: 14px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .price-section {
            text-align: center;
            padding: 20px 0;
        }
        .price {
            font-size: 48px;
            font-weight: bold;
            color: #00ff88;
        }
        .price.down { color: #ff4444; }
        .change {
            font-size: 24px;
            margin-top: 10px;
        }
        .change.up { color: #00ff88; }
        .change.down { color: #ff4444; }
        .update-time {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .stat-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .stat-value.red { color: #ff4444; }
        .stat-value.green { color: #00ff88; }
        .news-section h3 {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .news-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .news-item:last-child { border: none; }
        .news-title {
            font-size: 14px;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .news-time {
            color: #666;
            font-size: 12px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .error {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: #ff4444;
        }
        .auto-refresh {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,255,136,0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            .stats { grid-template-columns: 1fr; }
            .price { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>有色ETF银华</h1>
            <div class="code">159871 | 深交所</div>
        </div>
        
        <div class="card">
            <div class="price-section">
                <div class="price" id="price">--</div>
                <div class="change" id="change">加载中...</div>
                <div class="update-time" id="updateTime">最近更新: --</div>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">近一年收益</div>
                    <div class="stat-value green" id="return1y">+103.36%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">近6月收益</div>
                    <div class="stat-value green" id="return6m">+45.15%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">近3月收益</div>
                    <div class="stat-value green" id="return3m">+27.09%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">近1月收益</div>
                    <div class="stat-value red" id="return1m">-0.27%</div>
                </div>
            </div>
        </div>
        
        <div class="card news-section">
            <h3>📰 最新资讯</h3>
            <div id="newsList">
                <div class="loading">正在加载资讯...</div>
            </div>
        </div>
    </div>
    
    <div class="auto-refresh" id="refreshStatus">🔄 自动刷新中</div>
    
    <script>
        const ETF_CODE = '159871';
        const API_URL = 'https://fund.eastmoney.com/pingzhongdata/' + ETF_CODE + '.js';
        
        let lastPrice = 0;
        let lastChange = 0;
        
        async function fetchData() {
            try {
                const response = await fetch(API_URL + '?v=' + Date.now());
                const text = await response.text();
                
                // 解析JS数据
                const data = parseJSData(text);
                
                if (data) {
                    updateUI(data);
                }
            } catch (error) {
                console.error('获取数据失败:', error);
                document.getElementById('change').textContent = '数据获取失败';
            }
        }
        
        function parseJSData(jsText) {
            // 提取净值数据
            const netWorthMatch = jsText.match(/var Data_netWorthTrend = (\[.*?\]);/);
            if (!netWorthMatch) return null;
            
            try {
                const trendData = JSON.parse(netWorthMatch[1]);
                if (!trendData || trendData.length === 0) return null;
                
                const latest = trendData[trendData.length - 1];
                const previous = trendData[trendData.length - 2];
                
                return {
                    price: latest.y,
                    change: latest.equityReturn,
                    time: new Date(latest.x).toLocaleString('zh-CN')
                };
            } catch (e) {
                console.error('解析数据失败:', e);
                return null;
            }
        }
        
        function updateUI(data) {
            const priceEl = document.getElementById('price');
            const changeEl = document.getElementById('change');
            const timeEl = document.getElementById('updateTime');
            
            priceEl.textContent = data.price.toFixed(4);
            
            const changeValue = parseFloat(data.change);
            if (changeValue >= 0) {
                priceEl.classList.remove('down');
                changeEl.className = 'change up';
                changeEl.textContent = '+' + changeValue.toFixed(2) + '%';
            } else {
                priceEl.classList.add('down');
                changeEl.className = 'change down';
                changeEl.textContent = changeValue.toFixed(2) + '%';
            }
            
            timeEl.textContent = '最近更新: ' + data.time;
        }
        
        // 初始化
        fetchData();
        
        // 每30秒刷新一次
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
